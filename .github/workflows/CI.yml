name: "CI"
on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]
jobs:
  test-github-actions:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'" 
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    env:
      MONGO_URI: mongodb://mongo:27017/test_git
      NODE_ENV: test

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v6.1.0
        with:
          node-version: 22
          cache: npm

      - name: install dependecies
        run: npm ci

      - name: wait for MongoDB to be ready
        run: |
          npm install -g mongodb-cli-tools
          until mongosh --host mongo:27017 --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
            echo "Waiting for MongoDB..."
            sleep 1
          done
          echo "MongoDB is ready!"

      - name: lint application
        run: npm run lint

      - name: format code
        run: npm run format

      - name: run tests
        run: npm test
